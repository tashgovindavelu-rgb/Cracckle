name: Kronos BTC M5 forecast
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Checkout official Kronos
        uses: actions/checkout@v4
        with:
          repository: shiyu-coder/Kronos
          path: kronos-source
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch numpy pandas requests huggingface_hub einops safetensors
      - name: Run genuine Kronos inference
        env:
          PYTHONPATH: kronos-source
        run: python forecast.py
      - name: Upload result if successful
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kronos-btc-m5-forecast
          path: output/
          retention-days: 7
